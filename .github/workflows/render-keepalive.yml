# Best-effort keep-alive for the ResearchX API on Render's Free plan, which spins a service down after a period without
# inbound traffic. Every 10 minutes it sends one GET to a static endpoint of the API: no database query, no model call,
# no research run. This is a workaround, not an uptime guarantee: GitHub may delay or skip scheduled runs, scheduled
# workflows pause after 60 days without repository activity, and Render's Free-plan rules (spin-down, monthly instance
# hours) still apply.
#
# Setup: Settings -> Secrets and variables -> Actions -> Variables -> New repository variable
#   RENDER_HEALTH_URL = https://<your-service>.onrender.com/api/openapi.json
# (/api/openapi.json is static; /api/health also reads the database, so it is not used here.)
name: Render keep-alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::warning::RENDER_HEALTH_URL is not set; nothing to ping."
            exit 0
          fi
          result=$(curl --silent --show-error --output /dev/null --max-time 30 --write-out '%{http_code} %{time_total}' "$URL") || {
            echo "::error::request to the API failed (timeout or network error)"
            exit 1
          }
          code=${result%% *}
          seconds=${result##* }
          echo "HTTP $code in ${seconds}s"
          case "$code" in
            2??) ;;
            *) echo "::error::unexpected HTTP status $code"; exit 1 ;;
          esac
